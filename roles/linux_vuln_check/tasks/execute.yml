- name: Create work directory
  ansible.builtin.file:
    path: /tmp/vuln_check
    state: directory
    mode: '0777'

- name: Upload vulnerability script
  ansible.builtin.copy:
    src: LINUX_2026.sh
    dest: /tmp/vuln_check/LINUX_2026.sh
    mode: '0755'

- name: Run vulnerability check
  become: true
  become_user: root
  ansible.builtin.shell: |
    export Running_WebService=0
    export FIND_CHECK=1

    /tmp/vuln_check/LINUX_2026.sh
  args:
    executable: /bin/bash