- name: Set archive date
  ansible.builtin.set_fact:
    archive_date: "{{ lookup('pipe', 'date +%Y%m%d') }}"

- name: Find result directories
  ansible.builtin.find:
    paths: "/tmp/vuln_check"
    file_type: directory
    patterns: "LINUX*"
    recurse: yes
  register: result_dirs

- name: Show result directories
  ansible.builtin.debug:
    var: result_dirs.files

- name: Compress result directory
  ansible.builtin.shell: |
    tar -czvf /tmp/result-{{ inventory_hostname }}-{{ archive_date }}.tar.gz \
    -C "{{ item.path | dirname }}" \
    "{{ item.path | basename }}"
  loop: "{{ result_dirs.files }}"
  when: result_dirs.matched > 0

- name: Fetch archive to AWX
  ansible.builtin.fetch:
    src: "/tmp/result-{{ inventory_hostname }}-{{ archive_date }}.tar.gz"
    dest: "./result/"
    flat: yes
  when: result_dirs.matched > 0

- name: Upload archive to Nexus
  connection: local
  become: false
  ansible.builtin.shell: |
    curl -k -u "{{ nexus_user }}:{{ nexus_password }}" \
      --upload-file "/tmp/result-{{ inventory_hostname }}-{{ archive_date }}.tar.gz" \
      "{{ nexus_url }}/{{ nexus_repository }}/result-{{ inventory_hostname }}-{{ archive_date }}.tar.gz"
  when: result_dirs.matched > 0