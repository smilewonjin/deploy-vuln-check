- name: Find result directories
  ansible.builtin.find:
    paths: 
      - "/root"                    # 🔍 1. 루트 홈 디렉토리 검사
      - "/home"                    # 🔍 2. 일반 유저 홈 디렉토리 검사
      - "/tmp"                     # 🔍 3. 임시 디렉토리 검사
    file_type: directory
    patterns: "*vuln*"             # 💡 폴더 이름에 'vuln'이 들어가는 모든 디렉토리 검색 (환경에 맞게 'result*' 등으로 변경 가능)
    recurse: yes                   # 하위 디렉토리까지 깊숙이 찾기
  register: result_dirs

- name: Compress result directory
  ansible.builtin.shell: |
    tar -czf /tmp/{{ inventory_hostname }}.tar.gz -C "{{ item.path | dirname }}" "{{ item.path | basename }}"
  loop: "{{ result_dirs.files }}"

- name: Fetch archive to AWX
  ansible.builtin.fetch:
    src: "/tmp/{{ inventory_hostname }}.tar.gz"
    dest: "./result/"
    flat: yes

- name: Upload archive to Nexus
  ansible.builtin.shell: |
    curl -k -u "{{ nexus_user }}:{{ nexus_password }}" \
    --upload-file "./result/{{ inventory_hostname }}.tar.gz" \
    "{{ nexus_url }}/{{ nexus_repository }}/{{ inventory_hostname }}/{{ inventory_hostname }}.tar.gz"
  delegate_to: localhost